<!DOCTYPE html>
<html>
<head>
  <title>قائمة المنتجات</title>
</head>
<body>
<div class="product-container">
  <h1 class="page-title">متاجر التسوق الإلكتروني</h1>

  <!-- منتج رقم 1: عرض تفاصيل منتج -->
  <div class="product-card">
    <img src="laptop.jpg" alt="صورة اللابتوب">
    <h2 class="product-name">Laptop Pro 15</h2>
    <p class="product-price">$999.99</p>
    <p class="product-description">لابتوب احترافي عالي الأداء مع معالج قوي وذاكرة عشوائية واسعة.</p>
    <input type="button" value="عرض التفاصيل">
    <input type="button" value="إضافة إلى السلة" disabled>
  </div>

  <!-- منتج رقم 2 -->
  <div class="product-card">
    <img src="phone.jpg" alt="صورة الهاتف">
    <h2 class="product-name">Smart Phone X</h2>
    <p class="product-price">$499.00</p>
    <p class="product-description">هاتف ذكي بشاشة عريضة وكاميرا عالية الدقة.</p>
    <input type="button" value="عرض التفاصيل">
  </div>
</div>
</body>
</html>
